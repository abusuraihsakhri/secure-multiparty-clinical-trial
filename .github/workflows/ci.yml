name: Python tests and security regressions

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tested package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
          python -m pip check
      - name: Syntax and tests
        run: |
          python -m compileall -q agents mpc_clinical_trial cli.py enrichment.py simulator.py
          pytest -q
      - name: Browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          assert match, "Missing application script"
          Path("/tmp/clinical-trial-app.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/clinical-trial-app.js
