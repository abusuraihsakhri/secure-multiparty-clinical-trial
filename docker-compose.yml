version: '3.8'

services:
  secure-multiparty-clinical-trial:
    build: .
    container_name: secure-multiparty-clinical-trial
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=secure-multiparty-clinical-trial-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
