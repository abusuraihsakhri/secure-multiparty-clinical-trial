[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-multiparty-clinical-trial"
version = "2.0.1"
description = "Educational rule-based audit and aggregate-only clinical trial survival demonstration"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
secure-multiparty-clinical-trial = "mpc_clinical_trial.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/secure-multiparty-clinical-trial"
Repository = "https://github.com/abusuraihsakhri/secure-multiparty-clinical-trial"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment"]

[tool.setuptools.packages.find]
include = ["agents*", "mpc_clinical_trial*"]
